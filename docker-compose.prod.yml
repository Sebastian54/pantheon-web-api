name: pantheon-prod

# Production stack for the self-hosted Proxmox deployment. Unlike
# docker-compose.yml (local dev), no service publishes a host port — the
# cloudflared tunnel is the only ingress path, matching the networking model
# in CLAUDE.md. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pantheon-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Overrides anything in .env.production — always points at the
      # postgres service's internal DNS name, not a host-facing address.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    expose:
      - "4000"
    networks:
      - pantheon-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time only: inlined into the client bundle. See the comment
        # in apps/web/Dockerfile for why real secrets aren't passed here.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    expose:
      - "3000"
    networks:
      - pantheon-net

  # Exists purely to prove `api`/`web` are actually name-resolvable and
  # HTTP-reachable from a peer container on pantheon-net. cloudflared's own
  # healthcheck below only proves it can reach Cloudflare's edge — it stayed
  # "healthy" through an incident where cloudflared's container couldn't
  # resolve "api" at all ("dial tcp: lookup api ...: no such host") and every
  # real request 502'd. cloudflared's image is a scratch build with no shell
  # (confirmed: `exec sh` fails with "executable file not found"), so it's
  # architecturally unable to run a check like this on itself — this sidecar
  # exists to cover that gap from a container that can.
  net-check:
    image: curlimages/curl:latest
    restart: unless-stopped
    command: ["sleep", "infinity"]
    depends_on:
      - api
      - web
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 3 http://api:4000/healthz && curl -fsS --max-time 3 -o /dev/null http://web:3000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pantheon-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --protocol http2 forces TCP instead of QUIC (UDP) — the LXC/Proxmox
    # network path was dropping/timing out long-lived QUIC connections.
    command: tunnel --protocol http2 --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
      # Exposes the metrics server on all interfaces (still only reachable
      # within pantheon-net) so `cloudflared tunnel ready` below has an
      # endpoint to query.
      TUNNEL_METRICS: 0.0.0.0:20241
    # cloudflared can end up with an established-but-not-actually-proxying
    # connection (seen in practice: `docker ps` shows "Up" while every
    # request 502s) that a plain `restart` doesn't reliably clear — only a
    # full recreate did. This at least surfaces that state accurately as
    # "unhealthy" instead of a misleading "Up", since Docker won't act on it
    # automatically (restart policies trigger on exit, not on failed
    # healthchecks) — `docker compose ps` is the signal to force-recreate it.
    # This only checks edge connectivity, not origin reachability — that's
    # what net-check (above) covers; requiring it healthy before cloudflared
    # even starts means a broken origin-DNS state now blocks the deploy
    # loudly instead of silently reporting "healthy" while every request 502s.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      net-check:
        condition: service_healthy
    networks:
      - pantheon-net

networks:
  pantheon-net:
    driver: bridge

volumes:
  postgres-data:
