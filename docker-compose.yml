name: pantheon

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pantheon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pantheon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pantheon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pantheon-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pantheon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pantheon}
    expose:
      - "4000"
    networks:
      - pantheon-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - apps/web/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pantheon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pantheon}
      NEXT_PUBLIC_API_URL: https://api.archer.software
    expose:
      - "3000"
    networks:
      - pantheon-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - api
      - web
    networks:
      - pantheon-net

networks:
  pantheon-net:
    driver: bridge

volumes:
  postgres-data:
